name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_run:
    workflows: ["Sync GitHub Clone Counts"]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Deploy to mindobix.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Configure git
          git config --global user.email "deploy@mindobix.com"
          git config --global user.name "MindObix Deploy"

          # Setup SSH key
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Clone destination repo
          git clone git@github.com:mindobix/mindobix.github.io.git /tmp/dest

          # Sync files — exclude .git and .github folders
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            . /tmp/dest/

          # Commit and push if there are changes
          cd /tmp/dest
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            # Read commit message from env so its contents (quotes, newlines,
            # backticks, etc.) cannot break the shell or be interpreted as code.
            if [ -z "$HEAD_COMMIT_MSG" ]; then
              printf 'Deploy from %s (%s)\n' "$EVENT_NAME" "$COMMIT_SHA" > /tmp/deploy_msg.txt
            else
              {
                printf 'Deploy: '
                printf '%s\n' "$HEAD_COMMIT_MSG"
              } > /tmp/deploy_msg.txt
            fi
            git commit -F /tmp/deploy_msg.txt
            git push origin master
          fi

      - name: Deploy subdomain landing pages
        env:
          SUBDOMAIN_DEPLOY_TOKEN: ${{ secrets.SUBDOMAIN_DEPLOY_TOKEN }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          if [ -z "$SUBDOMAIN_DEPLOY_TOKEN" ]; then
            echo "SUBDOMAIN_DEPLOY_TOKEN not configured; skipping subdomain deploys."
            exit 0
          fi

          if [ ! -d subdomains ]; then
            echo "No subdomains/ directory; nothing to deploy."
            exit 0
          fi

          workspace="$PWD"

          for sub_dir in subdomains/*/; do
            sub_dir="${sub_dir%/}"
            cname_file="$sub_dir/CNAME"

            if [ ! -f "$cname_file" ]; then
              echo "Skipping $sub_dir: no CNAME file."
              continue
            fi

            cname=$(tr -d '[:space:]' < "$cname_file")
            if [ -z "$cname" ]; then
              echo "Skipping $sub_dir: empty CNAME."
              continue
            fi

            # Repo name == the full subdomain (e.g. tradingjournal.mindobix.com)
            repo="$cname"
            target_dir="/tmp/sub-$(basename "$sub_dir")"
            rm -rf "$target_dir"

            echo "→ Deploying $sub_dir to mindobix/$repo"

            git clone "https://x-access-token:$SUBDOMAIN_DEPLOY_TOKEN@github.com/mindobix/$repo.git" "$target_dir"

            rsync -av --delete \
              --exclude='.git' \
              "$sub_dir/" "$target_dir/"

            cd "$target_dir"
            git add -A
            if git diff --staged --quiet; then
              echo "  No changes for $cname."
            else
              # Same shell-safe pattern as the main-site deploy above.
              if [ -z "$HEAD_COMMIT_MSG" ]; then
                printf 'Deploy from %s (%s)\n' "$EVENT_NAME" "$COMMIT_SHA" > /tmp/sub_msg.txt
              else
                {
                  printf 'Deploy: '
                  printf '%s\n' "$HEAD_COMMIT_MSG"
                } > /tmp/sub_msg.txt
              fi
              git commit -F /tmp/sub_msg.txt
              # Push to whichever branch the destination repo defaults to.
              default_branch=$(git symbolic-ref --short HEAD)
              git push origin "$default_branch"
            fi

            cd "$workspace"
          done
